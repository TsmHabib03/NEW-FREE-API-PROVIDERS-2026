<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -390 1000 1000" width="1000" height="220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="darkShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5a5a"/>
      <stop offset="30%" stop-color="#2b2b2b"/>
      <stop offset="45%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#3d3d3d"/>
      <stop offset="65%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="edgeShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    <style>
      .wordmark {
        font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        font-size: 130px;
        letter-spacing: 2px;
      }
    </style>
  </defs>

  <rect x="0" y="-390" width="1000" height="1000" fill="#ffffff"/><!-- Base dark metallic fill -->
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" class="wordmark" fill="url(#darkShine)" stroke="#000000" stroke-width="2">INFERENCE</text>

  <!-- Highlight overlay for shine -->
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" class="wordmark" fill="url(#edgeShine)" opacity="0.4">INFERENCE</text>
</svg>
