<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Inference">
  <defs>
    <linearGradient id="darkShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="30%" stop-color="#c9c9c9"/>
      <stop offset="45%" stop-color="#9a9a9a"/>
      <stop offset="50%" stop-color="#e6e6e6"/>
      <stop offset="65%" stop-color="#8f8f8f"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
    <style>
      .wordmark {
        font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        font-size: 250px;
        letter-spacing: 2px;
        text-anchor: middle;
      }
    </style>
  </defs>
  <rect width="1000" height="1000" fill="#0a0a0a"/>
  <text class="wordmark" x="500" y="440" fill="url(#darkShine)">INFER</text>
  <text class="wordmark" x="500" y="740" fill="url(#darkShine)">RENCE</text>
