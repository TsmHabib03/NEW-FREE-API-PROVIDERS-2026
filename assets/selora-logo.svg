<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F5FA"/>
      <stop offset="0.55" stop-color="#CDD6E4"/>
      <stop offset="1" stop-color="#8B9AB5"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.32" r="0.95">
      <stop offset="0" stop-color="#0E0E13"/>
      <stop offset="1" stop-color="#05070D"/>
    </radialGradient>
    <radialGradient id="core" cx="0.38" cy="0.34" r="0.9">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#F5F6F8"/>
      <stop offset="1" stop-color="#CDD6E4"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none"
        stroke="rgba(205,214,228,0.22)" stroke-width="4"/>

  <!-- Orbital ring, tilted -18deg like the existing mark -->
  <ellipse cx="256" cy="272" rx="160" ry="68" fill="none"
           stroke="url(#ring)" stroke-width="27" opacity="0.95"
           transform="rotate(-18 256 272)"/>

  <!-- Satellite on the ring's upper-right -->
  <circle cx="380" cy="220" r="27" fill="#E4E9F2"/>
  <circle cx="373" cy="213" r="8" fill="#F2F5FA" opacity="0.9"/>

  <!-- Core star -->
  <circle cx="256" cy="256" r="60" fill="url(#core)"/>
  <circle cx="234" cy="234" r="15" fill="#E4E9F2" opacity="0.75"/>

  <!-- Soft ring glow (subtle, matches the site's edge-glow) -->
  <ellipse cx="256" cy="272" rx="172" ry="80" fill="none"
           stroke="rgba(205,214,228,0.10)" stroke-width="44"
           transform="rotate(-18 256 272)"/>
</svg>